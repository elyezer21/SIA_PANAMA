services:
  postgres:
    image: postgres:16-alpine
    container_name: sia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sia_user
      POSTGRES_PASSWORD: sia_pass
      POSTGRES_DB: sia_panama
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sia_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:latest
    container_name: sia_clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav

  grafana:
    image: grafana/grafana-oss:latest
    container_name: sia_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - postgres

  backend:
    build: ./backend
    container_name: sia_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://sia_user:sia_pass@postgres:5432/sia_panama
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: sia_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  clamav_data:
  grafana_data:
